name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages-branch
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-docs-site
        with:
          base-path: /lithos
          docs-base-url: https://siriuslatte.github.io/lithos
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Branch-based Pages keeps production at /lithos while preserving
      # preview content under /lithos/previews/pr-<number>/.
      - name: Deploy production docs to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/site/out
          clean: true
          clean-exclude: |
            previews
