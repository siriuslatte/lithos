name: docs-preview

on:
  pull_request:
    branches: [dev, main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-preview:
    name: docs-preview
    runs-on: ubuntu-latest
    env:
      PREVIEW_DIR: previews/pr-${{ github.event.pull_request.number }}
      PREVIEW_PATH: /lithos/previews/pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://siriuslatte.github.io/lithos/previews/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout pull request head
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect docs-related changes
        if: github.event.action != 'closed'
        id: detect
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

          mapfile -t changed_files < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          matches=()

          # The preview path is intentionally conservative:
          # - docs/** (published site sources, shared packages, and build scripts)
          # - top-level docs-facing Markdown that collaborators treat as repo docs
          # - the docs deploy / preview workflows and shared docs build action
          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/*|README.md|MIGRATION.md|CONTRIBUTING.md|SUPPORT.md|SECURITY.md|CODE_OF_CONDUCT.md|MAINTAINERS.md|.github/workflows/deploy-docs.yml|.github/workflows/docs-preview.yml|.github/workflows/docs-preview-publish.yml|.github/actions/build-docs-site/*)
                matches+=("$file")
                ;;
            esac
          done

          mkdir -p .github/tmp/docs-preview

          : > .github/tmp/docs-preview/changed-files.txt
          : > .github/tmp/docs-preview/matched-files.txt

          if [ "${#changed_files[@]}" -gt 0 ]; then
            printf '%s\n' "${changed_files[@]}" > .github/tmp/docs-preview/changed-files.txt
          fi

          if [ "${#matches[@]}" -gt 0 ]; then
            printf '%s\n' "${matches[@]}" > .github/tmp/docs-preview/matched-files.txt
            echo "docs_touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_touched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build docs preview site
        if: github.event.action != 'closed' && steps.detect.outputs.docs_touched == 'true'
        uses: ./.github/actions/build-docs-site
        with:
          base-path: ${{ env.PREVIEW_PATH }}
          docs-base-url: ${{ env.PREVIEW_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize docs preview result
        shell: bash
        run: |
          {
            echo "## docs-preview"
            echo

            if [ "${{ github.event.action }}" = "closed" ]; then
              echo "PR #${{ github.event.pull_request.number }} closed. The companion publish workflow will remove any existing preview under ${PREVIEW_PATH}."
              exit 0
            fi

            if [ "${{ steps.detect.outputs.docs_touched }}" = "true" ]; then
              echo "Docs-related changes were detected in the full PR diff against ${{ github.event.pull_request.base.ref }}."
              echo
              echo "Preview URL shape: ${PREVIEW_URL}"
              echo
              echo "Matched paths:"
              sed 's/^/- /' .github/tmp/docs-preview/matched-files.txt
              exit 0
            fi

            echo "No docs-related changes were detected in the full PR diff against ${{ github.event.pull_request.base.ref }}."
            echo
            echo "This check still succeeds so branch protection sees a stable no-op result."
            echo
            echo "Trigger rules:"
            echo "- docs/**"
            echo "- README.md, MIGRATION.md, CONTRIBUTING.md, SUPPORT.md, SECURITY.md, CODE_OF_CONDUCT.md, MAINTAINERS.md"
            echo "- .github/workflows/deploy-docs.yml"
            echo "- .github/workflows/docs-preview.yml"
            echo "- .github/workflows/docs-preview-publish.yml"
            echo "- .github/actions/build-docs-site/**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview site artifact
        if: github.event.action != 'closed' && steps.detect.outputs.docs_touched == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-site
          path: docs/site/out
          if-no-files-found: error

      - name: Write preview metadata
        shell: bash
        run: |
          mkdir -p .github/tmp/docs-preview

          docs_touched=false
          if [ "${{ github.event.action }}" != "closed" ] && [ "${{ steps.detect.outputs.docs_touched }}" = "true" ]; then
            docs_touched=true
          fi

          changed_json='[]'
          matched_json='[]'

          if [ -s .github/tmp/docs-preview/changed-files.txt ]; then
            changed_json=$(jq -R -s 'split("\n") | map(select(length > 0))' .github/tmp/docs-preview/changed-files.txt)
          fi

          if [ -s .github/tmp/docs-preview/matched-files.txt ]; then
            matched_json=$(jq -R -s 'split("\n") | map(select(length > 0))' .github/tmp/docs-preview/matched-files.txt)
          fi

          jq -n \
            --arg action "${{ github.event.action }}" \
            --arg base_ref "${{ github.event.pull_request.base.ref }}" \
            --arg preview_dir "$PREVIEW_DIR" \
            --arg preview_path "$PREVIEW_PATH" \
            --arg preview_url "$PREVIEW_URL" \
            --argjson pr_number "${{ github.event.pull_request.number }}" \
            --argjson docs_touched "$docs_touched" \
            --argjson changed_files "$changed_json" \
            --argjson matched_files "$matched_json" \
            '{
              action: $action,
              base_ref: $base_ref,
              docs_touched: $docs_touched,
              preview_dir: $preview_dir,
              preview_path: $preview_path,
              preview_url: $preview_url,
              pr_number: $pr_number,
              changed_files: $changed_files,
              matched_files: $matched_files
            }' > .github/tmp/docs-preview/metadata.json

      - name: Upload preview metadata
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-meta
          path: .github/tmp/docs-preview/metadata.json
          if-no-files-found: error